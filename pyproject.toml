[project]
name = "frappe_paystack"
authors = [
    { name = "Anthony Emmanuel", email = "hackacehuawei@gmail.com"}
]
description = "Paystack integration for Frappe/ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"